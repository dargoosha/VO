apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: prescriptions-lab3
  labels:
    app: worker
spec:
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9000"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: prescriptions-worker:lab4
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: postgres
            - name: WEB_URL
              value: http://web
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: T_POLL_MS
              value: "100"
            - name: LEASE_SECONDS
              value: "15"
            - name: FAIL_RATE
              value: "0"
            - name: CLAIM_MODE
              value: locked
            - name: CLAIM_BATCH_SIZE
              value: "1"
            - name: HEARTBEAT_ENABLED
              value: "true"
            - name: POISON_SEED_ZERO
              value: "true"
            - name: SHUTDOWN_TIMEOUT_SECONDS
              value: "25"
          ports:
            - name: metrics
              containerPort: 9000
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: worker-metrics
  namespace: prescriptions-lab3
spec:
  selector:
    app: worker
  ports:
    - name: metrics
      port: 9000
      targetPort: metrics
